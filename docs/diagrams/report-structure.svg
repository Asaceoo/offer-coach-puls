<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Microsoft YaHei, SimSun, sans-serif">
  <rect x="0" y="0" width="680" height="340" fill="#f7fafc"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a5276">岗位报告：六部分结构（一个 JD = 一份独立 PDF）</text>

  <!-- 第一部分 -->
  <rect x="30" y="50" width="620" height="46" rx="6" fill="#1a5276"/>
  <text x="50" y="70" font-size="12.5" font-weight="bold" fill="#ffffff">第一部分 · 投递决策速览（七问深读）</text>
  <text x="50" y="88" font-size="10.5" fill="#d6eaf8">岗位是做什么的 ｜ 日常工作内容 ｜ 公司真正想招什么样的人 ｜ 匹配度 ｜ 值不值得投 ｜ 面试重点 ｜ 风险点与确认清单</text>
  <text x="640" y="78" text-anchor="end" font-size="10" fill="#d6eaf8">结论先行</text>

  <!-- 第二部分 -->
  <rect x="30" y="106" width="620" height="46" rx="6" fill="#2874a6"/>
  <text x="50" y="126" font-size="12.5" font-weight="bold" fill="#ffffff">第二部分 · 岗位公司深度调研（七项固定结构）</text>
  <text x="50" y="144" font-size="10.5" fill="#d6eaf8">工商概况 ｜ 业务产品 ｜ 行业地位与经营动态 ｜ 组织与招聘信号 ｜ 口碑与风险 ｜ 对投递判断的影响 ｜ 来源列表</text>
  <text x="640" y="134" text-anchor="end" font-size="10" fill="#d6eaf8">查无实据→（未核实），不编造</text>

  <!-- 第三部分 -->
  <rect x="30" y="162" width="620" height="46" rx="6" fill="#3498db"/>
  <text x="50" y="182" font-size="12.5" font-weight="bold" fill="#ffffff">第三部分 · 岗位档案与四维分析</text>
  <text x="50" y="200" font-size="10.5" fill="#d6eaf8">岗位本质 ｜ 核心要求（强度标注）｜ 隐含要求（措辞→信号）｜ 理想候选人画像 ｜ 与定位的贴合度</text>

  <!-- 第四部分 -->
  <rect x="30" y="218" width="620" height="46" rx="6" fill="#48c9b0"/>
  <text x="50" y="238" font-size="12.5" font-weight="bold" fill="#154360">第四部分 · 简历匹配诊断（三分法）</text>
  <text x="50" y="256" font-size="10.5" fill="#154360">直接匹配（引用简历原文+强度）｜ 可迁移能力（迁移逻辑链）｜ 关键缺口（话术/行动补法）｜ 差距 Top 3 —— 无匹配百分比</text>

  <!-- 第五部分 -->
  <rect x="30" y="274" width="620" height="46" rx="6" fill="#f7dc6f"/>
  <text x="50" y="294" font-size="12.5" font-weight="bold" fill="#6e2c00">第五部分 · 题库（47~55 题，七类）</text>
  <text x="50" y="312" font-size="10.5" fill="#6e2c00">岗位职责 8~10 ｜ 行业认知 6~8 ｜ 通用软性 5~6 ｜ 术语解释 8~10 ｜ 情景问答 8~10 ｜ 案例梳理 4~5 ｜ 高频问题 8~10</text>

  <!-- 第六部分 -->
  <rect x="30" y="330" width="620" height="0" rx="6" fill="#ffffff"/>
  <text x="340" y="330" text-anchor="middle" font-size="10" fill="#888">↓</text>
  <text x="340" y="336" text-anchor="middle" font-size="10" fill="#888">第六部分 · 投递状态与漏斗（快照；唯一事实源 jobs/index.md）</text>

  <!-- 右侧标记 -->
  <text x="665" y="20" text-anchor="end" font-size="10" fill="#888">铁律：报告只含本岗位内容</text>
</svg>
