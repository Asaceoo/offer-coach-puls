<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Microsoft YaHei, SimSun, sans-serif">
  <rect x="0" y="0" width="680" height="330" fill="#f7fafc"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a5276">岗位报告六部分（一个 JD 一份独立 PDF）</text>

  <rect x="20" y="40" width="640" height="40" rx="6" fill="#1a5276"/>
  <text x="38" y="58" font-size="12" font-weight="bold" fill="#fff">一 · 投递决策速览（七问深读）</text>
  <text x="38" y="73" font-size="9.5" fill="#d6eaf8">岗位做什么 ｜ 日常内容 ｜ 公司想招谁 ｜ 匹配度 ｜ 值不值得投 ｜ 面试重点 ｜ 风险与确认清单</text>

  <rect x="20" y="86" width="640" height="40" rx="6" fill="#2874a6"/>
  <text x="38" y="104" font-size="12" font-weight="bold" fill="#fff">二 · 岗位公司深度调研（八项）</text>
  <text x="38" y="119" font-size="9.5" fill="#d6eaf8">工商概况 ｜ 业务产品 ｜ 行业地位（含量化数字）｜ 招聘信号 ｜ 口碑风险 ｜ 情报缺口 ｜ 结论 ｜ 来源</text>

  <rect x="20" y="132" width="640" height="40" rx="6" fill="#3498db"/>
  <text x="38" y="150" font-size="12" font-weight="bold" fill="#fff">三 · 岗位档案与四维分析</text>
  <text x="38" y="165" font-size="9.5" fill="#eaf4fc">岗位本质 ｜ 核心要求（强度）｜ 隐含要求（JD 措辞→信号）｜ 理想候选人画像 ｜ 与定位贴合度</text>

  <rect x="20" y="178" width="640" height="58" rx="6" fill="#48c9b0"/>
  <text x="38" y="196" font-size="12" font-weight="bold" fill="#154360">四 · 简历匹配诊断</text>
  <text x="38" y="211" font-size="9.5" fill="#154360">4.1 三分法：直接匹配（引原文）｜ 可迁移 ｜ 关键缺口 ｜ 差距 Top 3</text>
  <text x="38" y="226" font-size="9.5" fill="#154360">4.2 面试六维评估卡：硬实力｜软实力思维｜匹配度｜动机稳定性｜文化契合｜潜力性价比 —— 每维四栏 + 最弱维度</text>

  <rect x="20" y="242" width="640" height="40" rx="6" fill="#f7dc6f"/>
  <text x="38" y="260" font-size="12" font-weight="bold" fill="#6e2c00">五 · 题库（51~60 题，八类）</text>
  <text x="38" y="275" font-size="9.5" fill="#6e2c00">岗位职责 ｜ 行业认知 ｜ 通用软性 ｜ 术语解释 ｜ 情景问答 ｜ 案例梳理 ｜ 高频问题 ｜ 压力测试（接化发）</text>

  <rect x="20" y="288" width="640" height="32" rx="6" fill="#af7ac5"/>
  <text x="38" y="305" font-size="12" font-weight="bold" fill="#fff">六 · 投递状态与漏斗</text>
  <text x="38" y="317" font-size="9" fill="#f4d9f4">状态快照（唯一事实源 jobs/index.md）｜ 产出物计数 ｜ 投递漏斗</text>

  <text x="655" y="22" text-anchor="end" font-size="9.5" fill="#888">同批交付：P0 精练卡（1 页）+ 定制简历</text>
</svg>
