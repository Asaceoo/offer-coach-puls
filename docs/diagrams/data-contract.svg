  <text x="118" y="104" text-anchor="middle" font-size="10.5" fill="#333">references/ ×7（按需加载）</text>
  <text x="34" y="124" font-size="9.5" fill="#555">job-analysis 四维+七问 ｜ match-framework 三分法+六维</text>
  <text x="34" y="139" font-size="9.5" fill="#555">question-design 50 题八类+六维覆盖 ｜ interview-plan 押题查漏</text>
  <text x="34" y="154" font-size="9.5" fill="#555">review-template 复盘反哺 ｜ positioning-and-stories 定位+卡</text>
  <text x="34" y="169" font-size="9.5" fill="#555">offer-stage 谈薪/拒因/90 天</text>
  <text x="118" y="192" text-anchor="middle" font-size="10.5" fill="#333">assets/templates/ ×13</text>
  <text x="118" y="210" text-anchor="middle" font-size="9.5" fill="#888">唯一输出格式来源</text>
  <text x="118" y="232" text-anchor="middle" font-size="9.5" fill="#888">报告 · 精练卡 · 定位 · 故事卡</text>
  <text x="118" y="247" text-anchor="middle" font-size="9.5" fill="#888">简历 · 辅导 · 复盘 · offer</text>
  <text x="118" y="262" text-anchor="middle" font-size="9.5" fill="#888">onboarding · 拒因 · 索引</text>

  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#b7950b"/></marker>
    <marker id="c" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2874a6"/></marker>
  </defs>
  <line x1="216" y1="110" x2="262" y2="110" stroke="#b7950b" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="262" y1="232" x2="216" y2="232" stroke="#2874a6" stroke-width="1.5" marker-end="url(#c)"/>
  <text x="239" y="100" text-anchor="middle" font-size="9" fill="#7d6608">读上下文</text>
  <text x="239" y="224" text-anchor="middle" font-size="9" fill="#1a5276">写产出</text>

  <rect x="264" y="42" width="396" height="244" rx="8" fill="#fdf6e3" stroke="#b7950b" stroke-width="1.5"/>
  <text x="462" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#7d6608">工作区 offer-coach/（读写）</text>

  <rect x="278" y="74" width="176" height="56" rx="6" fill="#ffffff" stroke="#b7950b"/>
  <text x="366" y="92" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7d6608">positioning.md + story-cards.md</text>
  <text x="366" y="108" text-anchor="middle" font-size="9.5" fill="#555">定位 5 问 ｜ 战例卡 SC-xx</text>
  <text x="366" y="122" text-anchor="middle" font-size="9.5" fill="#555">失败卡 SC-Fxx（压力题唯一素材源）</text>

  <rect x="466" y="74" width="180" height="56" rx="6" fill="#ffffff" stroke="#b7950b"/>
  <text x="556" y="92" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7d6608">resume/master.md</text>
  <text x="556" y="108" text-anchor="middle" font-size="9.5" fill="#555">简历唯一事实源</text>
  <text x="556" y="122" text-anchor="middle" font-size="9.5" fill="#555">所有引用的锚点</text>

  <rect x="278" y="140" width="368" height="60" rx="6" fill="#ffffff" stroke="#b7950b"/>
  <text x="462" y="158" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7d6608">jobs/{job-id}/（一岗一目录 · 一岗一报告）</text>
  <text x="462" y="174" text-anchor="middle" font-size="9.5" fill="#555">report.md（六部分，含 4.2 六维评估卡）→ exports/岗位报告.pdf</text>
  <text x="462" y="188" text-anchor="middle" font-size="9.5" fill="#555">p0-card.md → exports/P0精练卡.pdf ｜ tailored-resume.md</text>

  <rect x="278" y="210" width="368" height="62" rx="6" fill="#ffffff" stroke="#b7950b"/>
  <text x="462" y="228" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7d6608">jobs/index.md（状态唯一事实源）｜ playbook.md（话术+顽固卡点）</text>
  <text x="462" y="244" text-anchor="middle" font-size="9.5" fill="#555">interview-plan.md ｜ review-{n}.md ｜ offer-{n}.md ｜ onboarding-90.md</text>
  <text x="462" y="260" text-anchor="middle" font-size="9.5" fill="#555">导出物默认含个人信息 → 分享前删除联系方式与薪酬信息</text>

  <text x="340" y="310" text-anchor="middle" font-size="10" fill="#888">红线：所有结论引用 master.md 原文 ｜ 缺数据标【待补】不代编 ｜ 报告与索引不混岗 ｜ 数据不上云</text>
