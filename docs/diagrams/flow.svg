<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Microsoft YaHei, SimSun, sans-serif">
  <rect x="0" y="0" width="680" height="300" fill="#f7fafc"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a5276">offer-coach 五阶段：先看懂岗位，再决定怎么投</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#1a5276"/></marker>
  </defs>

  <g>
    <rect x="24" y="52" width="118" height="132" rx="8" fill="#ffffff" stroke="#1a5276" stroke-width="1.5"/>
    <text x="83" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a5276">① 定位</text>
    <text x="83" y="92" text-anchor="middle" font-size="10" fill="#333">5 问定位面谈</text>
    <text x="83" y="108" text-anchor="middle" font-size="10" fill="#333">故事卡 + 失败卡</text>
    <text x="83" y="126" text-anchor="middle" font-size="10" fill="#333">岗位第一道筛子</text>
    <text x="83" y="152" text-anchor="middle" font-size="9.5" fill="#888">底线以下直接不投</text>
  </g>
  <g>
    <rect x="158" y="52" width="118" height="132" rx="8" fill="#ffffff" stroke="#1a5276" stroke-width="1.5"/>
    <text x="217" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a5276">② 岗位分析</text>
    <text x="217" y="92" text-anchor="middle" font-size="10" fill="#333">六部分报告 PDF</text>
    <text x="217" y="108" text-anchor="middle" font-size="10" fill="#333">八类 51~60 题</text>
    <text x="217" y="126" text-anchor="middle" font-size="10" fill="#333">公司深度调研</text>
    <text x="217" y="152" text-anchor="middle" font-size="9.5" fill="#888">一岗一报告·不混岗</text>
  </g>
  <g>
    <rect x="292" y="52" width="118" height="132" rx="8" fill="#ffffff" stroke="#1a5276" stroke-width="1.5"/>
    <text x="351" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a5276">③ 备战</text>
    <text x="351" y="92" text-anchor="middle" font-size="10" fill="#333">D-3/D-1/D-0 计划</text>
    <text x="351" y="108" text-anchor="middle" font-size="10" fill="#333">押题按六维查漏</text>
    <text x="351" y="126" text-anchor="middle" font-size="10" fill="#333">P0 精练卡（1 页）</text>
    <text x="351" y="152" text-anchor="middle" font-size="9.5" fill="#888">能量排程·提醒可选</text>
  </g>
  <g>
    <rect x="426" y="52" width="118" height="132" rx="8" fill="#ffffff" stroke="#1a5276" stroke-width="1.5"/>
    <text x="485" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a5276">④ 面试+复盘</text>
    <text x="485" y="92" text-anchor="middle" font-size="10" fill="#333">压力彩排（红队）</text>
    <text x="485" y="108" text-anchor="middle" font-size="10" fill="#333">押题命中率</text>
    <text x="485" y="126" text-anchor="middle" font-size="10" fill="#333">反哺话术库+题库</text>
    <text x="485" y="152" text-anchor="middle" font-size="9.5" fill="#888">下一场第一个动作</text>
  </g>
  <g>
    <rect x="560" y="52" width="96" height="132" rx="8" fill="#eaf2f8" stroke="#1a5276" stroke-width="1.5"/>
    <text x="608" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a5276">⑤ 终局</text>
    <text x="608" y="92" text-anchor="middle" font-size="10" fill="#333">谈薪</text>
    <text x="608" y="108" text-anchor="middle" font-size="10" fill="#333">拒因归因</text>
    <text x="608" y="126" text-anchor="middle" font-size="10" fill="#333">90 天计划</text>
    <text x="608" y="152" text-anchor="middle" font-size="9.5" fill="#888">KPI=转正</text>
  </g>

  <line x1="142" y1="118" x2="156" y2="118" stroke="#1a5276" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="276" y1="118" x2="290" y2="118" stroke="#1a5276" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="410" y1="118" x2="424" y2="118" stroke="#1a5276" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="544" y1="118" x2="558" y2="118" stroke="#1a5276" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="24" y="200" width="632" height="80" rx="8" fill="#fdf6e3" stroke="#b7950b" stroke-width="1"/>
  <text x="340" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7d6608">三条贯穿全程的红线</text>
  <text x="340" y="240" text-anchor="middle" font-size="10.5" fill="#7d6608">① 反虚构：结论引用简历原文，缺数据标【待补】不代编</text>
  <text x="340" y="256" text-anchor="middle" font-size="10.5" fill="#7d6608">② 无匹配百分比：差距用三分法 + 六维评估卡表达</text>
  <text x="340" y="272" text-anchor="middle" font-size="10.5" fill="#7d6608">③ 不做自动投递：只准备材料，不碰招聘账号</text>
</svg>
